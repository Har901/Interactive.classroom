<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Classroom — questioning, trying, failing, simulating, and defending the value of teachers." />
  <title>Interactive Classroom</title>
  <style>
    :root{--bg:#060708;--panel:#0f1114;--line:rgba(255,255,255,.1);--text:#f4f4f1;--muted:#a9adb3;--gold:#f3d58a;--blue:#69b7ff;--shadow:0 25px 80px rgba(0,0,0,.28);--radius:26px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
    button,input,textarea{font:inherit}button{cursor:pointer}.ambient{position:fixed;pointer-events:none;filter:blur(70px);opacity:.22;z-index:0}.ambient-one{width:380px;height:380px;background:#176fc5;left:-160px;top:120px;border-radius:50%}.ambient-two{width:340px;height:340px;background:#e7b94b;right:-160px;bottom:80px;border-radius:50%}
    .site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;backdrop-filter:blur(15px);background:rgba(5,5,5,.66);border-bottom:1px solid rgba(255,255,255,.06)}
    .brand{font-size:12px;letter-spacing:.18em;color:#d8d8d5;font-weight:800}.menu-btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;border-radius:14px;width:42px;height:42px;display:grid;place-items:center;transition:.25s}.menu-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)}
    .site-footer{display:flex;justify-content:space-between;gap:20px;padding:28px 5vw;color:#73767b;font-size:12px;border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:2}.page{min-height:100vh;position:relative;z-index:1;padding:120px 5vw 70px;animation:pageIn .45s ease}@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .hero{max-width:1050px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 0 26px}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8e9298;margin-bottom:16px}.hero-pill{position:relative;display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;overflow:hidden}.hero-pill:before,.hero-pill:after{content:"";position:absolute;width:34px;height:34px;border:1px solid rgba(255,255,255,.18);border-radius:50%;top:50%;transform:translateY(-50%)}.hero-pill:before{left:-18px}.hero-pill:after{right:-18px}.hero-pill span{font-size:clamp(38px,7vw,86px);line-height:1;font-weight:900;letter-spacing:-.055em;background:linear-gradient(100deg,#fff 5%,#f3d58a 45%,#69b7ff 78%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(105,183,255,.12)}.hero-line{width:min(760px,90%);height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);margin:4px auto 22px}.tagline{font-size:clamp(18px,3vw,29px);line-height:1.4;color:#d8d9da;max-width:900px}.tagline span{color:#79bfff}
    .intro-wrap{max-width:980px;margin:0 auto}.section-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;margin-top:24px}.section-card h2{margin:0 0 14px;font-size:28px;letter-spacing:-.02em}.section-card p{margin:0 0 18px;color:#d3d5d8;line-height:1.8;font-size:16px}.quote{padding:18px 18px 18px 22px;border-left:2px solid var(--gold);margin:24px 0;color:#efefec;font-style:italic;background:rgba(243,213,138,.03);border-radius:0 16px 16px 0}
    .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.pillar{padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.02);transition:.3s}.pillar:hover{transform:translateY(-5px);border-color:rgba(105,183,255,.35);box-shadow:0 18px 50px rgba(47,111,255,.08)}.pillar-num{font-size:11px;letter-spacing:.18em;color:#7faaf3;margin-bottom:10px;text-transform:uppercase}.pillar h3{margin:0 0 10px;font-size:20px}.pillar p{font-size:14px!important;line-height:1.7!important}
    .nav-area{max-width:980px;margin:30px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.nav-card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);border-radius:22px;padding:22px;text-align:left;color:#fff;transition:.28s;position:relative;overflow:hidden}.nav-card:after{content:"";position:absolute;inset:auto -30px -50px auto;width:120px;height:120px;border-radius:50%;background:rgba(105,183,255,.12);filter:blur(20px)}.nav-card:hover{transform:translateY(-6px);border-color:rgba(243,213,138,.4);box-shadow:0 18px 50px rgba(0,0,0,.25)}.nav-card .tiny{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8d92}.nav-card strong{display:block;font-size:22px;margin:7px 0}.nav-card small{color:#b3b6bb;line-height:1.5}
    .searchbar{max-width:980px;margin:22px auto 0;display:flex;gap:10px}.searchbar input{flex:1;padding:15px 18px;border-radius:17px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.04);color:#fff;outline:none}.searchbar input:focus{border-color:rgba(105,183,255,.55);box-shadow:0 0 0 4px rgba(105,183,255,.08)}.action-btn{border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));color:#fff;border-radius:17px;padding:13px 18px;transition:.25s}.action-btn:hover{transform:translateY(-2px);border-color:rgba(243,213,138,.45)}.back-btn{position:relative;z-index:3;margin-bottom:24px}
    .page-head{max-width:1100px;margin:0 auto 28px}.page-head h1{font-size:clamp(40px,6vw,72px);margin:0 0 10px;letter-spacing:-.045em}.page-head p{color:#aeb1b6;max-width:760px;line-height:1.7}.light-page{background:linear-gradient(180deg,#fbfbfa,#f3f5f7);color:#121316}.light-page .site-footer{color:#7a7d83;border-color:rgba(0,0,0,.08)}
    .subject-grid{max-width:800px;margin:35px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.subject-card{padding:24px;border-radius:22px;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 15px 40px rgba(0,0,0,.06);text-align:left;transition:.28s}.subject-card:hover{transform:translateY(-5px)}.subject-card h3{font-size:24px;margin:10px 0}.subject-card p{color:#60646b;line-height:1.6}
    .chat-layout{max-width:980px;margin:0 auto}.chat-card{background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:24px;box-shadow:0 18px 50px rgba(20,26,40,.08);overflow:hidden}.chat-top{padding:18px 20px;border-bottom:1px solid rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center;gap:15px}.chat-title{font-weight:800}.chat-status{font-size:11px;color:#2d6d3a;background:#eaf8ed;padding:7px 10px;border-radius:999px;white-space:nowrap}.messages{min-height:450px;max-height:560px;overflow:auto;padding:22px;background:linear-gradient(180deg,#ffffff,#f7f8fa)}.msg{max-width:78%;padding:13px 15px;border-radius:18px;margin-bottom:12px;line-height:1.6;font-size:14px}.msg.ai{background:#eef6ff;border-top-left-radius:6px}.msg.user{background:#111315;color:#fff;margin-left:auto;border-top-right-radius:6px}.chat-input{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(0,0,0,.07);background:#fff}.chat-input textarea{resize:none;flex:1;min-height:52px;max-height:140px;padding:13px 14px;border:1px solid rgba(0,0,0,.12);border-radius:15px;outline:none}.send-btn{background:#111315;color:#fff;border:none;border-radius:15px;padding:0 18px}.hint-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px;background:#fff}.hint-chip{border:1px solid rgba(0,0,0,.1);background:#f7f8fa;color:#3c4147;border-radius:999px;padding:7px 10px;font-size:12px}.stage{max-width:980px;margin:0 auto 18px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:14px 16px;color:#474b50;font-size:13px}.stage strong{color:#111315}.ai-badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6c8eb8}
    .sim-page{background:linear-gradient(180deg,#fffce9,#fff7da 45%,#fffef7);color:#191a1b}.sim-page .site-footer{color:#777;border-color:rgba(0,0,0,.08)}.lab-tabs{max-width:1000px;margin:24px auto;display:flex;gap:10px;flex-wrap:wrap}.tab-btn{border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.75);padding:11px 14px;border-radius:14px;color:#1a1b1e}.tab-btn.active{background:#111315;color:#fff}.lab-panel{max-width:1000px;margin:0 auto;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.09);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(60,47,0,.07)}
    .model-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#666;margin-bottom:7px}.idea-input{width:100%;min-height:230px;padding:14px;border:1px solid rgba(0,0,0,.12);border-radius:15px;resize:vertical;background:#fff;color:#111}.model-output{padding:18px;border-radius:18px;background:#111315;color:#fff;line-height:1.7;min-height:230px}.model-output h3{margin:0 0 10px;color:#fff}.model-output p{margin:8px 0;color:#e4e6e8}.model-output .muted{color:#b3b7bc;font-size:13px}.model-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.run-btn{margin-top:12px;background:#111315!important;color:#fff!important}.simulation-stage{margin-top:20px;padding:20px;border-radius:22px;background:linear-gradient(180deg,#10131a,#080a0e);color:#fff;border:1px solid rgba(0,0,0,.1)}.sim-canvas-shell{border-radius:18px;overflow:hidden;background:#07090d;border:1px solid rgba(255,255,255,.08)}#ideaCanvas{display:block;width:100%;height:280px}.sim-question{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:10px}.sim-question input{padding:13px 15px;border:1px solid rgba(0,0,0,.12);border-radius:13px;background:#fff;color:#111}.answer-card{margin-top:12px;background:#fff;border-radius:17px;padding:15px;color:#34383c;line-height:1.65;min-height:70px}.model-slider{margin-top:18px}.model-slider strong{display:flex;justify-content:space-between;margin-bottom:8px}.model-slider input{width:100%}.model-note{font-size:12px;color:#b9bdc3;margin-top:8px}
    .orbit-wrap{display:grid;grid-template-columns:1fr 280px;gap:20px}.canvas-shell{border-radius:22px;overflow:hidden;background:radial-gradient(circle at center,#15203c 0,#080c15 48%,#020307 100%);border:1px solid rgba(255,255,255,.08)}#orbitCanvas{display:block;width:100%;height:520px}.controls{background:rgba(255,255,255,.8);border-radius:18px;padding:18px}.controls input{width:100%}.control-row{margin-bottom:17px}.control-row strong{display:flex;justify-content:space-between;margin-bottom:7px}.small-note{font-size:12px;color:#666;line-height:1.5}.orbit-guide{margin-top:20px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:18px}.orbit-guide h3{margin:0 0 7px}.orbit-guide p{margin:0;color:#50545a;line-height:1.65}.orbit-question{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}.orbit-question input{padding:12px 14px;border:1px solid rgba(0,0,0,.12);border-radius:13px}
    .article{max-width:920px;margin:0 auto}.article h1{font-size:clamp(42px,7vw,88px);letter-spacing:-.05em;margin:0 0 25px}.article p{font-size:17px;line-height:1.9;color:#d8dadc;margin:0 0 20px}.article .quote{font-size:20px;color:#f5f5f0}.article .closing{border:1px solid rgba(243,213,138,.18);padding:26px;border-radius:22px;background:rgba(243,213,138,.03);margin-top:28px}.article .attribution{color:#9da0a5;font-size:13px}
    .mobile-nav{position:fixed;right:18px;top:68px;z-index:60;background:rgba(15,15,15,.96);border:1px solid rgba(255,255,255,.12);padding:10px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;min-width:220px}.mobile-nav.open{display:block}.mobile-nav button{width:100%;text-align:left;background:none;border:none;color:#fff;padding:12px;border-radius:10px}.mobile-nav button:hover{background:rgba(255,255,255,.06)}
    .tiny-separator{height:1px;background:rgba(0,0,0,.08);margin:18px 0}.notice{font-size:12px;color:#777;line-height:1.6;margin-top:8px}
    @media (max-width:800px){.pillars,.nav-area,.subject-grid,.model-grid,.orbit-wrap{grid-template-columns:1fr}.hero{padding-top:35px}.page{padding-left:18px;padding-right:18px}.site-footer{flex-direction:column}.messages{min-height:380px}.msg{max-width:88%}.orbit-wrap #orbitCanvas{height:390px}.sim-question,.orbit-question{grid-template-columns:1fr}.chat-top{align-items:flex-start;flex-direction:column}.searchbar{flex-direction:column}}
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="site-header"><div class="brand">INTERACTIVE CLASSROOM</div><button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button></header>
  <main id="app" aria-live="polite"></main>
  <footer class="site-footer"><span>Interactive Classroom</span><span>Question · Try · Fail · Simulate · Discover</span></footer>

<script>
const app=document.getElementById('app'), menuBtn=document.getElementById('menuBtn');
const state={subject:null,simTab:'model',running:true,simIdea:'',simProfile:'generic',modelValue:50};

const homeText={
  intro:`As a student, I have thought, if I had an active session where I could address my questions, go beyond school-level education, and see formulas operating in the real world rather than just calculating and getting a number! I was passionate about science, fascinated by the way ancient scientists thought of a new idea and used that principle to solve a current problem, and how it connected to numbers describing nature precisely. This classroom is designed for students who wonder—who wonder beyond basic education level by challenging and questioning formulas which exist by doing one simple thing: asking “why”. Just by asking a simple question, we can understand how interconnected numbers and the real world are.`,
  newton:`There is a quote I would love to mention. It says, “A wise man learns more from a fool than a fool learns from a wise man.” I have seen this quote from the point of view that a person asking a simple question may seem like a fool or be looked down upon, but those were the people who revolutionized the world, like Sir Isaac Newton, asking why an apple falls down to Earth and whether the same gravity could be related to the Moon. For someone who lived in 1666, asking such a question was bizarre. Even for modern life, including me, I was amazingly surprised how asking this question would have brought other people to laugh about it, yet he kept asking, trying and trying, and even developed new mathematics since the mathematical expressions available to him were insufficient for the variables he wanted to calculate. He finally did it. Newton formulated great principles; in fact, one is now called a law! Which is noble work. So, in creating this website, I seek to create what young children, or even I, could use as an ideal—what I basically wished it would have been: an active session, simulation, and discovering an idea from scratch.`,
  close:`So I intend to make my website interactive by making rigorous education as it is, but without sucking the passion out of it. I created this website to be interactive because of three important pillars`,
  pillars:[
    ['01','Questioning',`First, starting off by asking a student, “Do you know about gravity?” And the student would say yes. Then moving on to asking them why they would believe that what they believe is true and why this assumption would not work. It would make things simple and challenging at the same time, making the person think hard enough to come up with a formulation from scratch, enabling them to discover a certain concept.`],
    ['02','Trying, failing and keep trying',`I believe nothing in life has ever been perfect—that someone had to try so many times to reach a goal, just like throwing a basketball into the net: we try many times until finally we achieve it. So my website includes making simulations, testing ideas and assumptions through questioning until students truly understand and grasp the concept.`],
    ['03','Simulating',`Lastly, and most importantly, simulating: ideas testing and making, redesigning ideas that better fit the problem solution until they are finally ready to blossom the potential in our head, and our head starts to simulate.`]
  ]
};

const article=`I would defend the idea of teachers not being replaced by AI. Even though AI could do many tasks effortlessly and with precision, I would still support the idea that replacing teachers with AI means replacing the animate with the inanimate. It is not just about replacing life with non-life; instead, it is underlaying the true power and value of life being masked by a machine that can just teach. Of course, AI can make things simpler and even more comprehensive than teachers, but the value of life comes with teaching—teaching with passion, love, and respect for the concept they are trying to teach. And I believe that is what has driven people for the last thousands of years: making them feel amazed, awestruck, passionate, joy, and failure. All those emotions combined created and shaped our world up to now. People are now fascinated by scientists who formulated the fundamental principles, like Sir Isaac Newton. I believe this fire of passion ignites within students, sparking their potential and unlocking their ability to reach excellence! And I believe teachers are the ones who are able to manage and do such things. I have proof, and that proof is me, because I believe my teachers have poured their knowledge, passion, and time into me—not just to say, “I memorize stuff,” but rather to ignite the passion within me and let me see the world from a different perspective.`;

function layout(page,cls=''){app.innerHTML=`<section class="page ${cls}">${page}</section>`;window.scrollTo({top:0,behavior:'smooth'});}
function backButton(){return `<button class="action-btn back-btn" onclick="renderHome()">← Back to Interactive Classroom</button>`}
function navMenu(){if(document.getElementById('mobileNav'))return;const el=document.createElement('div');el.id='mobileNav';el.className='mobile-nav';el.innerHTML=`<button onclick="renderHome();closeMenu()">Home</button><button onclick="renderQuestioning();closeMenu()">Questioning</button><button onclick="renderSimulation();closeMenu()">Simulation</button><button onclick="renderArticle();closeMenu()">Defending Article</button>`;document.body.appendChild(el)}
function closeMenu(){document.getElementById('mobileNav')?.classList.remove('open')}menuBtn.addEventListener('click',()=>{navMenu();document.getElementById('mobileNav').classList.toggle('open')});

function renderHome(){const pillars=homeText.pillars.map(p=>`<article class="pillar"><div class="pillar-num">Pillar ${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p></article>`).join('');layout(`<div class="hero"><div class="eyebrow">A classroom built around curiosity</div><div class="hero-pill"><span>Interactive Classroom</span></div><div class="hero-line"></div><div class="tagline">shaping young children towards <span>creativity</span> and fostering <span>their</span> potential in the right way!</div></div><div class="intro-wrap"><article class="section-card"><h2>Why I intended this website</h2><p>${homeText.intro}</p><div class="quote">“A wise man learns more from a fool than a fool learns from a wise man”</div><p>${homeText.newton}</p><p>${homeText.close}</p><div class="pillars">${pillars}</div></article><div class="searchbar"><input id="siteSearch" placeholder="Search website" aria-label="Search website" onkeydown="if(event.key==='Enter')searchWebsite()"/><button class="action-btn" onclick="searchWebsite()">Search website</button></div><div class="nav-area"><button class="nav-card" onclick="renderQuestioning()"><span class="tiny">Pillar 01</span><strong>Questioning</strong><small>Challenge assumptions through calm, one-by-one conversation.</small></button><button class="nav-card" onclick="renderSimulation()"><span class="tiny">Pillar 03</span><strong>Simulation</strong><small>Model an idea, test it, redesign it, and watch it operate.</small></button><button class="nav-card" onclick="renderArticle()"><span class="tiny">Final defense</span><strong>Defending Article</strong><small>The question: what should never be replaced?</small></button></div></div>`)}
function searchWebsite(){const q=(document.getElementById('siteSearch')?.value||'').toLowerCase();if(q.includes('question')||q.includes('gravity')||q.includes('chem'))renderQuestioning();else if(q.includes('simulation')||q.includes('model')||q.includes('orbit'))renderSimulation();else if(q.includes('teacher')||q.includes('defend'))renderArticle();else alert('Try searching for questioning, gravity, chemistry, simulation, modeling, orbit, or teacher.')}

function renderQuestioning(){layout(`<div class="light-page" style="min-height:100vh;margin:-120px -5vw -70px;padding:120px 5vw 70px"><div style="max-width:1000px;margin:0 auto">${backButton()}<div class="page-head"><div class="eyebrow">Questioning</div><h1>Select a subject</h1><p>Calm, composed, one-by-one conversation. The goal is not to rush to the answer; it is to examine why the answer feels right. The guided AI prototype responds to your reasoning and keeps the conversation moving.</p></div><div class="subject-grid"><button class="subject-card" onclick="startChat('physics')"><div class="eyebrow">Subject 01</div><h3>Physics</h3><p>Start with gravity, assumptions, and the habit of asking “why”.</p></button><button class="subject-card" onclick="startChat('chemistry')"><div class="eyebrow">Subject 02</div><h3>Chemistry</h3><p>Start with atoms, evidence, and the habit of testing an explanation.</p></button></div></div></div>`)}
function addMsg(role,text){const box=document.getElementById('messages');if(!box)return;const d=document.createElement('div');d.className='msg '+role;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
function startChat(subject){state.subject=subject;const topic=subject==='physics'?'gravity':'atoms';layout(`<div class="light-page" style="min-height:100vh;margin:-120px -5vw -70px;padding:120px 5vw 70px"><div class="chat-layout">${backButton()}<div class="stage"><span class="ai-badge">Guided AI prototype</span><br><strong>This is a reasoning conversation, not an answer sheet.</strong> The guide listens to your answer, asks why, introduces a “what if?” scenario, and asks what evidence could support your idea.</div><div class="chat-card"><div class="chat-top"><div><div class="chat-title">${subject==='physics'?'Physics · Gravity':'Chemistry · Atoms'}</div><div style="font-size:12px;color:#858990;margin-top:4px">Question → reason → challenge → test → reflect</div></div><div class="chat-status">Interactive guide</div></div><div class="messages" id="messages"></div><div class="hint-row"><button class="hint-chip" onclick="useChatHint('Why?')">Ask: Why?</button><button class="hint-chip" onclick="useChatHint('What if my assumption is wrong?')">Ask: What if?</button><button class="hint-chip" onclick="useChatHint('What evidence would test this?')">Ask: What evidence?</button></div><div class="chat-input"><textarea id="chatInput" placeholder="Type your answer, challenge the guide, or ask your own question..."></textarea><button class="send-btn" onclick="sendChat()">Send</button></div></div></div></div>`);addMsg('ai',`What do you know about ${topic}?`)}
function useChatHint(t){const i=document.getElementById('chatInput');if(i){i.value=t;i.focus()}}
function sendChat(){const input=document.getElementById('chatInput');if(!input||!input.value.trim())return;const text=input.value.trim();input.value='';addMsg('user',text);setTimeout(()=>addMsg('ai',generateTutorReply(text,state.subject)),180)}
function generateTutorReply(text,subject){const l=text.toLowerCase();const topic=subject==='physics'?'gravity':'atoms';
  if(l.includes('evidence')||l.includes('test'))return subject==='physics'?'Good. For gravity, one useful test is to change one variable while holding the others as steady as possible. What would you measure: time, distance, speed, or acceleration?':'Good. For atoms, ask what observation would distinguish your model from another model. What evidence could we actually observe or measure?';
  if(l.includes('why')&&!l.includes('why do you'))return `Then let us sharpen the question. Why should ${topic} behave that way rather than some other way? Give me the reason you are relying on, even if you are not completely sure.`;
  if(l.includes('what if')||l.includes('wrong'))return subject==='physics'?'Imagine your gravity assumption were wrong. What would you expect to see in a falling object or an orbit? Choose one prediction and defend it.':'Imagine the atom were not arranged the way you described. What observable result would change? Make one prediction before we check it.';
  if(subject==='physics' && (l.includes('force')||l.includes('pull')||l.includes('earth')||l.includes('mass')||l.includes('acceleration'))){return 'You have introduced an important physical idea. Now separate the claim from the evidence: what observation makes you believe that connection is necessary? And can you imagine a case where the same reasoning would not work?';}
  if(subject==='chemistry' && (l.includes('electron')||l.includes('proton')||l.includes('neutron')||l.includes('nucleus')||l.includes('element'))){return 'That gives us a model of the atom. Now challenge it: what makes you confident that this model explains what we observe? What would you expect to happen if one part of your model changed?';}
  if(l.includes('i don')||l.includes('not sure')||l.includes('dont know'))return `Not knowing is useful here. Instead of guessing the final answer, make a small prediction about ${topic}. What do you think would happen, and what makes you think so?`;
  return 'Interesting. I am not going to give you the answer yet. First, state the assumption behind your answer in one sentence. Then ask yourself: “What would I expect to observe if this assumption were true?”';
}

function renderSimulation(){layout(`<div class="sim-page" style="min-height:100vh;margin:-120px -5vw -70px;padding:120px 5vw 70px"><div style="max-width:1080px;margin:0 auto">${backButton()}<div class="page-head"><div class="eyebrow">Simulation Lab</div><h1>Model, test, redesign.</h1><p>A small laboratory for turning assumptions into something visible. Use modeling for an idea-driven experiment, or run a planetary orbital system.</p></div><div class="lab-tabs"><button class="tab-btn ${state.simTab==='model'?'active':''}" onclick="switchSim('model')">Modeling · AI guide</button><button class="tab-btn ${state.simTab==='orbit'?'active':''}" onclick="switchSim('orbit')">Running simulation · Orbits</button></div><div id="simPanel"></div></div></div>`);state.simTab==='model'?renderModelPanel():renderOrbitPanel()}
function switchSim(tab){state.simTab=tab;renderSimulation()}
function renderModelPanel(){const panel=document.getElementById('simPanel');if(!panel)return;panel.innerHTML=`<div class="lab-panel"><div class="model-grid"><div><label class="form-label">Type your idea</label><textarea id="ideaInput" class="idea-input" placeholder="Example: I think a heavier object should always fall faster."></textarea><div class="model-actions"><button class="action-btn run-btn" onclick="modelIdea()">✨ Ask the AI to model my idea</button></div><div class="notice">The guide turns your words into an assumption, a prediction, a simple model, and a test. It is a prototype guide running inside this website.</div></div><div class="model-output" id="modelOutput"><h3>AI modeling guide</h3><p>Type an idea on the left.</p><p class="muted">Then the guide will help you define what the idea predicts before you run the model.</p></div></div><div id="ideaSimulation"></div></div>`}
function modelIdea(){const v=(document.getElementById('ideaInput')?.value||'').trim();if(!v)return;state.simIdea=v;const l=v.toLowerCase();let profile='generic',assumption='',prediction='',test='';if(l.includes('fall')||l.includes('gravity')||l.includes('heavy')||l.includes('mass')){profile='gravity';assumption='Mass changes how you think the object should fall, while gravitational acceleration near Earth is kept as the comparison baseline.';prediction='Your claim predicts a measurable difference in falling behavior when mass changes.';test='Compare two objects while changing mass and keeping the comparison conditions as similar as possible. Then ask whether the result supports the original assumption.';}else if(l.includes('orbit')||l.includes('planet')||l.includes('moon')||l.includes('sun')){profile='orbit';assumption='The motion of an orbiting body depends on the relationship between gravitational attraction, distance, and motion.';prediction='Changing distance or gravitational strength should change the shape or timing of the orbit.';test='Change one parameter at a time. Observe whether the orbit responds in the direction your idea predicted.';}else if(l.includes('atom')||l.includes('electron')||l.includes('chem')){profile='atom';assumption='Your explanation depends on a particular picture of what an atom contains and how its parts behave.';prediction='If the model is useful, changing one part of the assumption should lead to a predictable change in the result.';test='Identify one observable consequence of the model and compare it with a changed assumption.';}else{assumption='Your statement contains an assumption that can be isolated and tested.';prediction='A useful model should produce a prediction that could be compared with an alternative assumption.';test='Choose one variable to change, one outcome to observe, and one condition to keep fixed. Then compare prediction with result.';}document.getElementById('modelOutput').innerHTML=`<h3>AI modeling guide</h3><p><strong>Your idea:</strong> ${escapeHtml(v)}</p><p><strong>Assumption:</strong> ${assumption}</p><p><strong>Prediction:</strong> ${prediction}</p><p><strong>Test:</strong> ${test}</p><div class="model-slider"><strong>Change the main variable <span id="modelVal">50</span></strong><input id="modelSlider" type="range" min="10" max="90" value="50" oninput="updateIdeaModel(this.value)"></div><button class="action-btn run-btn" onclick="runIdeaSimulation()">▶ Run the idea simulation</button>`;document.getElementById('ideaSimulation').innerHTML='';}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function updateIdeaModel(v){state.modelValue=Number(v);const el=document.getElementById('modelVal');if(el)el.textContent=v;if(document.getElementById('ideaCanvas'))drawIdeaSimulation()}
function runIdeaSimulation(){const wrap=document.getElementById('ideaSimulation');state.modelValue=Number(document.getElementById('modelSlider')?.value||50);wrap.innerHTML=`<div class="simulation-stage"><div class="eyebrow" style="color:#a9b4c7">AI idea simulation</div><h3 style="margin:0 0 6px">Your idea is now being tested visually</h3><p style="color:#c9ced6;line-height:1.6;margin-top:0">Change the variable above and observe the model. The goal is not to make the screen “look right”; it is to compare your prediction with what the model actually does.</p><div class="sim-canvas-shell"><canvas id="ideaCanvas" width="960" height="280"></canvas></div><div class="model-note">Tip: change the slider, then ask the guide below what changed and why.</div><div class="sim-question"><input id="simAsk" placeholder="Ask about your simulation…" onkeydown="if(event.key==='Enter')askSimulation()"><button class="action-btn" style="background:#111315;color:#fff" onclick="askSimulation()">Ask AI guide</button></div><div class="answer-card" id="simAnswer">Ask a question about what you are seeing.</div></div>`;drawIdeaSimulation()}
function drawIdeaSimulation(){const c=document.getElementById('ideaCanvas');if(!c)return;const ctx=c.getContext('2d'),w=c.clientWidth||960,h=c.clientHeight||280,scale=w/960;c.width=960;c.height=280;ctx.clearRect(0,0,960,280);ctx.fillStyle='#07090d';ctx.fillRect(0,0,960,280);const val=state.modelValue/100;ctx.strokeStyle='rgba(255,255,255,.08)';for(let x=0;x<960;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,280);ctx.stroke()}for(let y=0;y<280;y+=56){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}if(state.simProfile==='gravity'){for(let i=0;i<2;i++){const x=290+i*300,y=45+val*75+i*4,rad=14+(i===0?9:12);ctx.fillStyle=i===0?'#69b7ff':'#f3d58a';ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,y-rad-8);ctx.stroke()}ctx.fillStyle='#dfe4ea';ctx.font='14px system-ui';ctx.fillText('Two-object fall model · variable changes the displayed starting condition',24,250)}else if(state.simProfile==='orbit'){const cx=480,cy=140,r=65+val*1.3;ctx.strokeStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd57b';ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();const a=performance.now()/1800;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.62;ctx.fillStyle='#69b7ff';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dfe4ea';ctx.font='14px system-ui';ctx.fillText('Orbit model · distance is changing with your variable',24,250)}else{const base=80+val*2.6;ctx.fillStyle='#69b7ff';ctx.fillRect(70,210-base/2,base,base/2);ctx.fillStyle='#f3d58a';ctx.fillRect(440,210-base*.75,base*.8,base*.75);ctx.fillStyle='#dfe4ea';ctx.font='14px system-ui';ctx.fillText('Generic model · the visual changes as your chosen variable changes',24,250)}}
function askSimulation(){const i=document.getElementById('simAsk'),a=document.getElementById('simAnswer');if(!i||!a||!i.value.trim())return;const q=i.value.toLowerCase();const v=state.modelValue;let r;if(q.includes('why'))r=`Because the model is changing the selected variable (${v}/100) while leaving the other simplified assumptions in place. Try changing only this variable and describe whether the outcome changes in the direction you predicted.`;else if(q.includes('what changed')||q.includes('change'))r=`At the current setting of ${v}/100, the model changes its visual outcome. The key question is whether that change agrees with the prediction you made before running it.`;else if(q.includes('wrong')||q.includes('fail'))r='A result that disagrees with your prediction is not a failure of the learning process. It is useful information: inspect the assumption, change one variable, and test again.';else r='Treat the simulation as a question rather than a final answer. State what you observe, state what you expected, and then identify the assumption that connects the two.';a.textContent=r;i.value=''}

function renderOrbitPanel(){const panel=document.getElementById('simPanel');if(!panel)return;panel.innerHTML=`<div class="lab-panel"><div class="orbit-wrap"><div class="canvas-shell"><canvas id="orbitCanvas" width="900" height="560"></canvas></div><div class="controls"><div class="control-row"><strong>Time speed <span id="speedVal">1.0×</span></strong><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></div><div class="control-row"><strong>Gravity <span id="gravVal">1.0</span></strong><input id="gravity" type="range" min="0.4" max="1.8" step="0.1" value="1"></div><div class="control-row"><strong>Planet 1 distance <span id="distVal">145</span></strong><input id="distance" type="range" min="100" max="200" step="1" value="145"></div><button class="action-btn" onclick="toggleOrbit()" id="orbitToggle">Pause simulation</button><p class="small-note">This is an educational visual model, not a precision astronomy engine. Change one assumption and observe how the orbit responds.</p></div></div><div class="orbit-guide"><h3>Ask about the simulation</h3><p>The guide can explain what you are changing and why an orbit responds to distance, gravity, and time speed.</p><div class="orbit-question"><input id="orbitAsk" placeholder="Why does changing distance affect the orbit?" onkeydown="if(event.key==='Enter')askOrbit()"><button class="action-btn" onclick="askOrbit()">Ask AI guide</button></div><div class="answer-card" id="orbitAnswer">Your answer will appear here.</div></div></div>`;setupOrbit()}
function askOrbit(){const i=document.getElementById('orbitAsk'),a=document.getElementById('orbitAnswer');if(!i||!a||!i.value.trim())return;const q=i.value.toLowerCase();if(q.includes('distance'))a.textContent='In this simplified model, increasing distance changes the orbital radius. In a more complete gravitational model, orbital speed and period are also related to distance, so changing one variable can change the whole motion.';else if(q.includes('gravity'))a.textContent='Gravity provides the inward attraction in this model. Changing its strength changes how quickly the planets move around their paths.';else if(q.includes('speed')||q.includes('time'))a.textContent='Time speed changes how quickly the simulation advances on screen; it does not represent a physical change to the planet itself.';else a.textContent='Describe what you changed and what you observed. Then compare that observation with your original prediction—that is the heart of the simulation pillar.';i.value=''}
function setupOrbit(){const c=document.getElementById('orbitCanvas');if(!c)return;const ctx=c.getContext('2d'),speed=document.getElementById('speed'),gravity=document.getElementById('gravity'),distance=document.getElementById('distance');const planets=[{r:145,size:7,color:'#6fb6ff',a:.2},{r:205,size:9,color:'#f0c66a',a:2.4},{r:260,size:11,color:'#c7d0da',a:4.2}];function resize(){const rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.floor(rect.width*dpr);c.height=Math.floor(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();window.addEventListener('resize',resize,{once:true});let last=performance.now();function frame(now){const dt=Math.min(40,now-last);last=now;if(state.running){const sp=+speed.value,g=+gravity.value;planets[0].r=+distance.value;planets.forEach((p,i)=>p.a+=dt*.00065*sp*(Math.sqrt(g)/(1+i*.35)))}const w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);for(let i=0;i<90;i++){const x=(i*97)%w,y=(i*43)%h,a=((i*17)%60)/100;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(x,y,1.2,1.2)}planets.forEach(p=>{ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.arc(cx,cy,p.r,0,Math.PI*2);ctx.stroke()});const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,50);glow.addColorStop(0,'rgba(255,234,160,.95)');glow.addColorStop(.25,'rgba(255,196,70,.42)');glow.addColorStop(1,'rgba(255,196,70,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd57b';ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.fill();planets.forEach(p=>{const x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r,gr=ctx.createRadialGradient(x-2,y-2,1,x,y,p.size);gr.addColorStop(0,'#fff');gr.addColorStop(1,p.color);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill()});document.getElementById('speedVal').textContent=Number(speed.value).toFixed(1)+'×';document.getElementById('gravVal').textContent=Number(gravity.value).toFixed(1);document.getElementById('distVal').textContent=distance.value;requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function toggleOrbit(){state.running=!state.running;const b=document.getElementById('orbitToggle');if(b)b.textContent=state.running?'Pause simulation':'Run simulation'}

function renderArticle(){layout(`<div class="article">${backButton()}<div class="eyebrow">Defending Article</div><h1>Teacher shouldn't be replaced</h1><p>${article}</p><div class="quote">“Doesn't being able to think, able to have a passion that makes you wonder make you feel free?”</div><p>His words hit me hard, not just because being able to think, or just being a genius, automatically makes you something noble, but rather the passion burning inside, asking and demanding to know what truly that something is, is truly a gift.</p><div class="closing"><div class="eyebrow">One last quote from the great mathematician Carl Friedrich Gauss</div><p style="margin:0">“He demanded to know…”</p><p class="attribution" style="margin:14px 0 0">Carl Friedrich Gauss</p><p class="notice">The quote is presented here as the short line you wanted to include; the full source attribution can be added in the final version.</p></div></div>`)}

renderHome();window.renderHome=renderHome;window.renderQuestioning=renderQuestioning;window.renderSimulation=renderSimulation;window.renderArticle=renderArticle;window.startChat=startChat;window.sendChat=sendChat;window.switchSim=switchSim;window.modelIdea=modelIdea;window.toggleOrbit=toggleOrbit;window.searchWebsite=searchWebsite;window.closeMenu=closeMenu;window.askSimulation=askSimulation;window.askOrbit=askOrbit;window.useChatHint=useChatHint;window.updateIdeaModel=updateIdeaModel;window.runIdeaSimulation=runIdeaSimulation;
</script>
