<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Classroom — questioning, trying, failing, simulating, and defending the value of teachers." />
  <title>Interactive Classroom</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="site-header" id="siteHeader">
    <div class="brand">INTERACTIVE CLASSROOM</div>
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <span>Interactive Classroom</span>
    <span>Question · Try · Fail · Simulate · Discover</span>
  </footer>

  <script>
const app = document.getElementById('app');
const menuBtn = document.getElementById('menuBtn');
const body = document.body;

const state = { subject: null, history: [], simTab: 'model', angle: 0, running: true };

const homeText = {
  intro: `As a student I have thought if I had an active session where I address my question and go beyond school level education and seeing the formulas operating on real world rather than just calculating and getting number! I was passionate about science fascinated by the way how ancient time scientist thought of a new idea and use that principle to solve current problem and how it connected to numbers describing nature precisely. This classroom is designed for students who wonder, wonder beyond basic education level by challenging and questioning formula which existed by doing one simple thing asking “why” just by asking simple question we can understand how inter connected numbers and real world are.`,
  newton: `There is a quote I would love to mention it says “A wise man learns more from a fool than a fool learns from a wise man” I have seen this quote from point of view a person asking simple question may seems as a fool or underlined but those were the persons who revolutionized the world like sir Issac Newton asking if an apple fall down to Earth then why not the moon for someone who lived in 1666 asking such question was bizarre even for modern life including me which I was amazingly surprised how asking this question would have brought other people to laugh about it yet he kept asking trying and trying even invented his own mathematics since the mathematical expressions were insufficient to calculate the variable we wanted and he finally did it Newton invented a great principle in fact it's now called as a law! Which is a noble work. So creating this website I seek to create where young children or even me using it as an ideal or basically wished it would have been by making it active session, simulation and as well as discovering an idea from scratch`,
  close: `So I intend to make my website interactive by making the rigours education as it is but without sucking the passion out of it. I created this website to believe as interactive because of 4 important pillars`,
  pillars: [
    ['01','Questioning',`First starting off with asking a student do you know about gravity? And student would say yes And then moving on to asking them why would they believe something they believe was true and why not this assumption wouldn't work it would make things simple, challenging at same time making the person think hard enough to come UpTo formulation from scratch, enabling them how to discover a certain concept`],
    ['02','Trying, failing and keep trying',`I believe Nothing in life has ever been perfect that someone had to try so many time to reach its goal just like throwing a basketball to the net we try many times until finally we achieve it. So my website includes making simulation testing their ideas, assumptions through questioning until truly understand and grasp the concept`],
    ['03','Simulating',`Lastly and most importantly simulating Ideas testing and making, redesigning ideas that better fit the problem solution until it finally ready to blossom the potential in our head and head start to simulating`]
  ]
};

const article = `I would defend the idea of teachers being replaced by AI, even though Ai could do many tasks effortlessly with precision I would still support the idea the fact that we are replacing teachers with AI means replacing animate on inanimate it's not just about replacing life by non life instead it's underlaying the true power and value life being musked by a machine that can just teachs of course Ai can make things simpler and even comprehensive than teachers but the value of life comes with teaching, teaching in passion, love and respect for the concept they are trying to teach and that I be that drive people for the last thousands of years making them feel amazed, stacked, passionate, joy, fail all those emotions combined created and shaped our world upto now and now people fascinated by scientist who formulated the fundamental principles like sir Issac Newton I believe this passion of fire ignites within students that sparkle their potential and unlocking their ability to excellence! And I believe teachers are the one who can able and manage to be able to do such things and I have a proof and which is me because I believe my teachers have a poured their knowledge, passion and time not just to say I memorize stuffs but rather ignite the passio within me and the the world in a different perspective`;

function layout(page, cls='') {
  app.innerHTML = `<section class="page ${cls}">${page}</section>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function backButton(){ return `<button class="action-btn back-btn" onclick="renderHome()">← Back to Interactive Classroom</button>` }
function navMenu(){
  const el = document.createElement('div'); el.id='mobileNav'; el.className='mobile-nav';
  el.innerHTML = `<button onclick="renderHome();closeMenu()">Home</button><button onclick="renderQuestioning();closeMenu()">Questioning</button><button onclick="renderSimulation();closeMenu()">Simulation</button><button onclick="renderArticle();closeMenu()">Defending Article</button>`;
  document.body.appendChild(el);
}
function closeMenu(){document.getElementById('mobileNav')?.classList.remove('open')}
menuBtn.addEventListener('click',()=>{ if(!document.getElementById('mobileNav')) navMenu(); document.getElementById('mobileNav').classList.toggle('open'); });

function renderHome(){
  const pillars = homeText.pillars.map(p=>`<article class="pillar"><div class="pillar-num">Pillar ${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p></article>`).join('');
  layout(`
    <div class="hero">
      <div class="eyebrow">A classroom built around curiosity</div>
      <div class="hero-pill"><span>Interactive Classroom</span></div>
      <div class="hero-line"></div>
      <div class="tagline">shaping young children towards <span>creativity</span> and fostering Thier potential in right way!</div>
    </div>
    <div class="intro-wrap">
      <article class="section-card">
        <h2>Why I intended this website</h2>
        <p>${homeText.intro}</p>
        <div class="quote">“A wise man learns more from a fool than a fool learns from a wise man”</div>
        <p>${homeText.newton}</p>
        <p>${homeText.close}</p>
        <div class="pillars">${pillars}</div>
      </article>
      <div class="searchbar">
        <input id="siteSearch" placeholder="Search website" aria-label="Search website" />
        <button class="action-btn" onclick="searchWebsite()">Search website</button>
      </div>
      <div class="nav-area">
        <button class="nav-card" onclick="renderQuestioning()"><span class="tiny">Pillar 01</span><strong>Questioning</strong><small>Challenge assumptions through calm, one-by-one conversation.</small></button>
        <button class="nav-card" onclick="renderSimulation()"><span class="tiny">Pillar 03</span><strong>Simulation</strong><small>Model an idea, test it, redesign it, and watch it operate.</small></button>
        <button class="nav-card" onclick="renderArticle()"><span class="tiny">Final defense</span><strong>Defending Article</strong><small>The question: what should never be replaced?</small></button>
      </div>
    </div>`,'' );
}
function searchWebsite(){
  const q = (document.getElementById('siteSearch')?.value||'').toLowerCase();
  if(q.includes('question')||q.includes('gravity')||q.includes('chem')) renderQuestioning();
  else if(q.includes('simulation')||q.includes('model')||q.includes('orbit')) renderSimulation();
  else if(q.includes('teacher')||q.includes('defend')) renderArticle();
  else alert('Try searching for questioning, gravity, chemistry, simulation, modeling, orbit, or teacher.');
}

function renderQuestioning(){
  layout(`<div class="light-page" style="min-height:calc(100vh - 0px);margin:-120px -5vw -70px;padding:120px 5vw 70px">
    <div style="max-width:1000px;margin:0 auto">${backButton()}
      <div class="page-head"><div class="eyebrow">Questioning</div><h1>Select a subject</h1><p>Calm, composed, one-by-one conversation. The goal is not to rush to the answer; it is to examine why the answer feels right.</p></div>
      <div class="subject-grid">
        <button class="subject-card" onclick="startChat('physics')"><div class="eyebrow">Subject 01</div><h3>Physics</h3><p>Start with gravity, assumptions, and the habit of asking “why”.</p></button>
        <button class="subject-card" onclick="startChat('chemistry')"><div class="eyebrow">Subject 02</div><h3>Chemistry</h3><p>Start with atoms, evidence, and the habit of testing an explanation.</p></button>
      </div>
    </div></div>`, '');
}
function addMsg(role,text){
  const box=document.getElementById('messages'); if(!box) return;
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function startChat(subject){
  state.subject=subject;
  const first=subject==='physics'?'what do you know about gravity?':'what do you know about atoms?';
  layout(`<div class="light-page" style="min-height:calc(100vh - 0px);margin:-120px -5vw -70px;padding:120px 5vw 70px"><div class="chat-layout">${backButton()}<div class="chat-card"><div class="chat-top"><div class="chat-title">${subject==='physics'?'Physics · Gravity':'Chemistry · Atoms'}</div><div class="chat-status">Guided learning mode</div></div><div class="messages" id="messages"></div><div class="chat-input"><textarea id="chatInput" placeholder="Type your answer or ask a question..."></textarea><button class="send-btn" onclick="sendChat()">Send</button></div></div></div></div>`,'');
  addMsg('ai', `What do you know about ${subject==='physics'?'gravity':'atoms'}?`);
}
function sendChat(){
  const input=document.getElementById('chatInput'); if(!input||!input.value.trim()) return;
  const text=input.value.trim(); input.value=''; addMsg('user',text);
  const lower=text.toLowerCase();
  let reply='What do you believe makes the answer you gave the right one?';
  if(lower.includes('gravity') && state.subject==='physics') reply='What if your assumption about gravity were different? What would you expect to happen, and why?';
  else if(state.subject==='physics' && (lower.includes('force')||lower.includes('earth')||lower.includes('mass'))) reply='Why do you believe that connection is necessary? Can you imagine a scenario where the same assumption would not work?';
  else if(state.subject==='chemistry' && (lower.includes('atom')||lower.includes('electron')||lower.includes('proton'))) reply='What makes you confident that your description is the right one? What if we changed one assumption and tested the result?';
  else if(lower.includes('why')) reply='Good. Now make the question even sharper: what would you expect to observe if your idea were true?';
  addMsg('ai',reply);
}

function renderSimulation(){
  layout(`<div class="sim-page" style="min-height:calc(100vh - 0px);margin:-120px -5vw -70px;padding:120px 5vw 70px"><div style="max-width:1080px;margin:0 auto">${backButton()}<div class="page-head"><div class="eyebrow">Simulation Lab</div><h1>Model, test, redesign.</h1><p>A small laboratory for turning assumptions into something visible. Use modeling for an idea-driven experiment, or run a planetary orbital system.</p></div><div class="lab-tabs"><button class="tab-btn ${state.simTab==='model'?'active':''}" onclick="switchSim('model')">Modeling · AI guide</button><button class="tab-btn ${state.simTab==='orbit'?'active':''}" onclick="switchSim('orbit')">Running simulation · Orbits</button></div><div id="simPanel"></div></div></div>`,'');
  state.simTab==='model'?renderModelPanel():renderOrbitPanel();
}
function switchSim(tab){state.simTab=tab;renderSimulation()}
function renderModelPanel(){
  const panel=document.getElementById('simPanel'); if(!panel)return;
  panel.innerHTML=`<div class="lab-panel"><div class="model-grid"><div><label class="form-label">Your idea</label><textarea id="ideaInput" style="width:100%;min-height:230px;padding:14px;border:1px solid rgba(0,0,0,.12);border-radius:15px;resize:vertical" placeholder="Example: I think a heavier object should always fall faster."></textarea><button class="action-btn" style="margin-top:12px;background:#111315;color:white" onclick="modelIdea()">Ask the modeling guide</button></div><div class="model-output" id="modelOutput">The modeling guide will turn your idea into a small test: define an assumption, choose a variable, predict an outcome, then compare the prediction with a simple model.</div></div></div>`;
}
function modelIdea(){
  const v=document.getElementById('ideaInput').value.trim(); if(!v)return;
  const out=document.getElementById('modelOutput');
  const l=v.toLowerCase();
  if(l.includes('fall')||l.includes('gravity')) out.textContent='Try a controlled model: keep gravity constant, vary mass, and predict the motion before calculating. Then compare your prediction with the simulation. The important part is not only the number; it is the assumption behind it.';
  else if(l.includes('atom')) out.textContent='Break the idea into parts: what is your assumption about the atom, what observable result would follow, and what simple model could test that result? Then redesign the explanation if the observation disagrees.';
  else out.textContent='Start by naming your assumption. Next choose one variable that can change and one thing you can observe. Make a prediction before running the model, then redesign the idea after comparing the result.';
}
function renderOrbitPanel(){
  const panel=document.getElementById('simPanel'); if(!panel)return;
  panel.innerHTML=`<div class="lab-panel"><div class="orbit-wrap"><div class="canvas-shell"><canvas id="orbitCanvas" width="900" height="560"></canvas></div><div class="controls"><div class="control-row"><strong>Time speed <span id="speedVal">1.0×</span></strong><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"/></div><div class="control-row"><strong>Gravity <span id="gravVal">1.0</span></strong><input id="gravity" type="range" min="0.4" max="1.8" step="0.1" value="1"/></div><div class="control-row"><strong>Planet 1 distance <span id="distVal">145</span></strong><input id="distance" type="range" min="100" max="200" step="1" value="145"/></div><button class="action-btn" onclick="toggleOrbit()" id="orbitToggle">Pause simulation</button><p class="small-note">This is an educational visual model, not a precision astronomy engine. Change one assumption and observe how the orbit responds.</p></div></div></div>`;
  setupOrbit();
}
function setupOrbit(){
  const c=document.getElementById('orbitCanvas'); if(!c)return; const ctx=c.getContext('2d');
  const speed=document.getElementById('speed'), gravity=document.getElementById('gravity'), distance=document.getElementById('distance');
  const planets=[{r:145,size:7,color:'#6fb6ff',a:0.2,period:1300},{r:205,size:9,color:'#f0c66a',a:2.4,period:2100},{r:260,size:11,color:'#c7d0da',a:4.2,period:3300}];
  function resize(){const dpr=window.devicePixelRatio||1; const rect=c.getBoundingClientRect(); c.width=Math.floor(rect.width*dpr); c.height=Math.floor(rect.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0)}
  resize();
  window.addEventListener('resize',resize,{once:true});
  let last=performance.now();
  function frame(now){
    const dt=Math.min(40,now-last); last=now;
    if(state.running){const sp=parseFloat(speed.value); const g=parseFloat(gravity.value); planets[0].r=parseFloat(distance.value); planets.forEach((p,i)=>p.a += dt*0.00065*sp*(Math.sqrt(g)/(1+i*.35)));}
    const w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h/2; ctx.clearRect(0,0,w,h);
    // stars
    for(let i=0;i<90;i++){const x=(i*97)%w,y=(i*43)%h,alpha=((i*17)%60)/100;ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillRect(x,y,1.2,1.2)}
    planets.forEach(p=>{ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.arc(cx,cy,p.r,0,Math.PI*2);ctx.stroke()});
    const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,50);glow.addColorStop(0,'rgba(255,234,160,.95)');glow.addColorStop(.25,'rgba(255,196,70,.42)');glow.addColorStop(1,'rgba(255,196,70,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd57b';ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.fill();
    planets.forEach(p=>{const x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r;const gr=ctx.createRadialGradient(x-2,y-2,1,x,y,p.size);gr.addColorStop(0,'#fff');gr.addColorStop(1,p.color);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill()});
    document.getElementById('speedVal').textContent=Number(speed.value).toFixed(1)+'×';document.getElementById('gravVal').textContent=Number(gravity.value).toFixed(1);document.getElementById('distVal').textContent=distance.value;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function toggleOrbit(){state.running=!state.running;document.getElementById('orbitToggle').textContent=state.running?'Pause simulation':'Run simulation'}

function renderArticle(){
  layout(`<div class="article"><button class="action-btn back-btn" onclick="renderHome()">← Back to Interactive Classroom</button><div class="eyebrow">Defending Article</div><h1>Teacher shouldn't be replaced</h1><p>${article}</p><div class="quote">"Doesn't being able to think, able to have a passion that makes you wonder make you feel free"</div><p>his words hit me hard not just because being able to think or just being a genius automatically make you something noble but rather the passion burning inside asking, demanding to know what truly that something is truly a gift</p><div class="closing"><div class="eyebrow">One last quote</div><p style="margin:0">"He demanded to know.…"</p><p style="margin:14px 0 0;color:#9da0a5;font-size:13px">Carl's guss</p></div></div>`,'');
}

renderHome();
window.renderHome=renderHome;window.renderQuestioning=renderQuestioning;window.renderSimulation=renderSimulation;window.renderArticle=renderArticle;window.startChat=startChat;window.sendChat=sendChat;window.switchSim=switchSim;window.modelIdea=modelIdea;window.toggleOrbit=toggleOrbit;window.searchWebsite=searchWebsite;window.closeMenu=closeMenu;

</script>
</body>
</html>
